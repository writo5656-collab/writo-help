<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NPC Studio promo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,600;0,800;1,800;1,900&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Slides for CurseForge (rendered by tools/make_promo.py). Look: royal-blue studio backdrop, heavy italic display type, cyan + violet light squares. */
:root { --ink: #ffffff; --muted: #c6d2ff; --cyan: #5ad8ff; --violet: #b49cff; --blue-0: #0d1a63; --blue-1: #1d34a8; --blue-2: #3157e0; --panel: rgba(10, 20, 70, .55); --line: rgba(255, 255, 255, .22);
  --display: "Inter Tight", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; position: relative; background: transparent; color: var(--ink); font-family: var(--body); }
.slide { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1100px 620px at 68% 40%, var(--blue-2) 0%, var(--blue-1) 45%, var(--blue-0) 100%); }
.slide.round { inset: 40px 0 40px 0; border-radius: 48px; }
.slide::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 80px 80px; pointer-events: none; }
.sq { position: absolute; width: 30px; height: 30px; background: var(--violet); box-shadow: 0 0 30px var(--violet); opacity: .85; z-index: 1; }
.sq.c { background: var(--cyan); box-shadow: 0 0 30px var(--cyan); }
.sq.s { width: 18px; height: 18px; opacity: .55; }
canvas.stage { position: absolute; left: 0; top: 0; z-index: 3; }
.copy { position: absolute; left: 110px; top: 150px; width: 780px; z-index: 4; display: grid; gap: 26px; }
.eyebrow { font: 700 24px var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); }
h1 { font: italic 900 210px/0.86 var(--display); margin: 0; letter-spacing: -.035em; text-transform: uppercase; }
h2 { font: italic 900 104px/0.92 var(--display); margin: 0; letter-spacing: -.03em; text-transform: uppercase; }
.lede { font: 600 34px/1.35 var(--body); color: var(--muted); margin: 0; }
.tag { font: 600 70px/1 var(--display); color: var(--muted); letter-spacing: -.02em; }
.pill { display: inline-block; font: italic 800 30px var(--display); padding: 8px 22px; border-radius: 12px; background: var(--cyan); color: var(--blue-0); letter-spacing: .02em; }
.chips { display: flex; flex-wrap: wrap; gap: 14px; }
.chip { font: 700 26px var(--body); padding: 12px 22px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); }
.list { display: grid; gap: 18px; margin: 0; padding: 0; list-style: none; }
.list li { font: 700 34px/1.2 var(--body); display: flex; gap: 18px; align-items: baseline; }
.list li::before { content: ""; width: 16px; height: 16px; background: var(--cyan); flex: none; transform: translateY(-5px) rotate(45deg); }
.list small { display: block; font: 500 25px var(--body); color: var(--muted); margin-top: 6px; }
.logo { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
.badge { position: absolute; right: 70px; bottom: 56px; font: 700 26px var(--body); color: var(--muted); z-index: 4; letter-spacing: .04em; }
.badge b { color: var(--ink); }
.capes { position: absolute; right: 90px; top: 170px; width: 900px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 14px; z-index: 4; }
.capes img { width: 100%; image-rendering: pixelated; filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
.shot { position: absolute; right: 90px; top: 150px; width: 980px; border-radius: 18px; border: 3px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.5); z-index: 4; }
.code { font: 500 26px/1.45 var(--mono); background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 24px 28px; word-break: break-all; color: #d9f4ff; max-width: 780px; }
.code b { color: var(--cyan); }
.steps { display: grid; gap: 14px; }
.steps div { font: 700 30px var(--body); background: var(--panel); border-left: 6px solid var(--cyan); padding: 16px 22px; border-radius: 10px; }
.frame { position: absolute; z-index: 3; border-radius: 22px; border: 4px solid rgba(255,255,255,.3); box-shadow: 0 40px 90px rgba(5, 10, 40, .65); }
.glow { position: absolute; right: 120px; top: 40px; width: 900px; height: 580px; background: radial-gradient(closest-side, rgba(90, 216, 255, .45), transparent); z-index: 1; }
.tilt { position: absolute; z-index: 2; border-radius: 16px; border: 3px solid rgba(255,255,255,.35); box-shadow: 0 40px 80px rgba(5, 10, 40, .6); }
.hdr h2 { font-size: 118px; }
.hdr .sub { font: 600 32px var(--body); color: var(--muted); }
.num { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); font: italic 900 220px/1 var(--display); color: rgba(255,255,255,.12); z-index: 2; }
</style>
</head>
<body>
<div class="slide" id="slide"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const A = __ASSETS__; // data URIs: skins, capes, logo, capeIcons, shot
const slideName = location.hash.slice(1) || "cover";
const SIZE = { banner: [2000, 660] }; // everything else 1920x1080 unless it is a header (1400x260)
const [W, H] = SIZE[slideName] || (slideName.startsWith("h_") ? [1400, 260] : [1920, 1080]);
document.documentElement.style.width = document.body.style.width = W + "px";
document.documentElement.style.height = document.body.style.height = H + "px";
const slide = document.getElementById("slide");
const D = Math.PI / 180;

function load(src) { return new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = src; }); }
function tex(img, w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false; g.drawImage(img, 0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; return t;
}
function setUV(geo, rects, W, H) {
  const uv = geo.attributes.uv;
  rects.forEach(([x, y, w, h], i) => {
    const x0 = x / W, x1 = (x + w) / W, y0 = 1 - y / H, y1 = 1 - (y + h) / H;
    const q = i === 3 ? [[x0, y1], [x1, y1], [x0, y0], [x1, y0]] : [[x0, y0], [x1, y0], [x0, y1], [x1, y1]];
    q.forEach(([a, b], k) => uv.setXY(i * 4 + k, a, b));
  });
  uv.needsUpdate = true;
}
const boxRects = (u, v, w, h, d) => [[u + d + w, v + d, d, h], [u, v + d, d, h], [u + d, v, w, d], [u + d + w, v, w, d], [u + d, v + d, w, h], [u + 2 * d + w, v + d, w, h]];
function box(t, w, h, d, u, v, grow) {
  const g = new THREE.BoxGeometry(w + grow, h + grow, d + grow);
  setUV(g, boxRects(u, v, w, h, d), 64, 64);
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ map: t, transparent: true, alphaTest: 0.5, side: grow ? THREE.DoubleSide : THREE.FrontSide }));
}
const OUTLINE = new THREE.MeshBasicMaterial({ color: 0x5ad8ff, side: THREE.BackSide });
/** A Minecraft player NPC; pose = { head:[x,y,z], body, rarm, larm, rleg, lleg } in degrees. */
async function npc(skin, { slim = false, cape = null, pose = {}, outline = false } = {}) {
  const t = tex(await load(skin), 64, 64);
  const root = new THREE.Group(), parts = {};
  const aw = slim ? 3 : 4, ax = slim ? 5.5 : 6;
  const limb = (name, x, y, w, h, d, uv, ov, pivotY, parent = root) => {
    const p = new THREE.Group(); p.position.set(x, pivotY, 0);
    const a = box(t, w, h, d, uv[0], uv[1], 0), b = box(t, w, h, d, ov[0], ov[1], 0.5);
    a.position.y = b.position.y = y - pivotY; p.add(a, b);
    if (outline) { const o = new THREE.Mesh(new THREE.BoxGeometry(w + 1.1, h + 1.1, d + 1.1), OUTLINE); o.position.y = y - pivotY; p.add(o); }
    parent.add(p); parts[name] = p; return p;
  };
  const body = limb("body", 0, 18, 8, 12, 4, [16, 16], [16, 32], 12);
  // head and arms hang off the body so a bent body carries them
  const head = new THREE.Group(); head.position.set(0, 12, 0); body.add(head);
  limb("head", 0, 16, 8, 8, 8, [0, 0], [32, 0], 12, head);
  limb("rarm", -ax, 6, aw, 12, 4, [40, 16], [40, 32], 10, body);
  limb("larm", ax, 6, aw, 12, 4, [32, 48], [48, 48], 10, body);
  limb("rleg", -2, 6, 4, 12, 4, [0, 16], [0, 32], 12);
  limb("lleg", 2, 6, 4, 12, 4, [16, 48], [0, 48], 12);
  parts.head.position.set(0, 0, 0); // head pivot is the neck
  parts.rarm.position.y = 10; parts.larm.position.y = 10;
  if (cape) {
    const ct = tex(await load(cape), 64, 32);
    const g = new THREE.BoxGeometry(10, 16, 1);
    setUV(g, [[11, 1, 1, 16], [0, 1, 1, 16], [1, 0, 10, 1], [11, 0, 10, 1], [12, 1, 10, 16], [1, 1, 10, 16]], 64, 32);
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ map: ct }));
    const pv = new THREE.Group(); pv.position.set(0, 12, -2.6); pv.rotation.x = 0.18;
    m.position.set(0, -8, -0.5); pv.add(m); body.add(pv); parts.cape = pv;
  }
  const r = (o, v) => v && o.rotation.set(v[0] * D, (v[1] || 0) * D, (v[2] || 0) * D);
  r(parts.head, pose.head); r(body, pose.body); r(parts.rarm, pose.rarm); r(parts.larm, pose.larm); r(parts.rleg, pose.rleg); r(parts.lleg, pose.lleg);
  root.userData.parts = parts;
  return root;
}
/** Blender-style gizmos, drawn on top of everything. kind "move": thin axis lines with cone tips,
 *  small plane handles and a white centre ring. kind "rotate": three thin axis circles and a white view circle. */
function gizmo(size, kind = "move") {
  const g = new THREE.Group();
  const mat = (color, opacity = 1) => new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: opacity < 1, opacity });
  // Blender colours: X red, Y green (depth), Z blue (up). In three.js up is y, so the vertical axis is drawn blue.
  const COL = { x: 0xff3352, y: 0x2890ff, z: 0x8bdc00 };
  const AX = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
  const up = new THREE.Vector3(0, 1, 0);
  if (kind === "move") {
    for (const k of ["x", "y", "z"]) {
      const q = new THREE.Quaternion().setFromUnitVectors(up, AX[k]);
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, size, 12), mat(COL[k]));
      shaft.position.copy(AX[k]).multiplyScalar(size / 2); shaft.quaternion.copy(q);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(1.1, 3.2, 20), mat(COL[k]));
      cone.position.copy(AX[k]).multiplyScalar(size + 1.1); cone.quaternion.copy(q);
      g.add(shaft, cone);
    }
    // plane handles: small squares between two axes, coloured like the axis they don't move
    const plane = (a1, a2, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), mat(COL[k], 0.75));
      m.material.side = THREE.DoubleSide;
      m.position.copy(AX[a1]).add(AX[a2]).multiplyScalar(size * 0.32);
      m.lookAt(m.position.clone().add(AX[k])); g.add(m);
    };
    plane("y", "z", "x"); plane("x", "z", "y"); plane("x", "y", "z");
    const c = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.2, 8, 40), mat(0xffffff));
    c.userData.face = true; g.add(c);
  } else {
    const ring = (k) => {
      const t = new THREE.Mesh(new THREE.TorusGeometry(size, 0.3, 8, 128), mat(COL[k]));
      if (k === "x") t.rotation.y = Math.PI / 2; if (k === "y") t.rotation.x = Math.PI / 2; g.add(t);
    };
    ring("x"); ring("y"); ring("z");
    const view = new THREE.Mesh(new THREE.TorusGeometry(size * 1.2, 0.22, 8, 128), mat(0xffffff, 0.85));
    view.userData.face = true; g.add(view);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), mat(0xffffff)); g.add(dot);
  }
  g.traverse((o) => (o.renderOrder = 10));
  return g;
}
/** Turn the gizmo's white circles to face the camera, like Blender does. */
function faceCamera(g, camPos) {
  const p = new THREE.Vector3(...camPos);
  g.traverse((o) => {
    if (!o.userData.face) return;
    const wp = new THREE.Vector3(); o.getWorldPosition(wp);
    const wq = new THREE.Quaternion(); o.parent.getWorldQuaternion(wq);
    const m = new THREE.Matrix4().lookAt(p, wp, new THREE.Vector3(0, 1, 0));
    o.quaternion.setFromRotationMatrix(m).premultiply(wq.invert());
  });
}
function stage(camPos, look, fov = 30) {
  const c = document.createElement("canvas"); c.className = "stage"; slide.appendChild(c);
  c.style.width = W + "px"; c.style.height = H + "px";
  const r = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(W, H, false);
  const s = new THREE.Scene();
  s.add(new THREE.AmbientLight(0xffffff, 0.72));
  const sun = new THREE.DirectionalLight(0xffffff, 0.62); sun.position.set(-40, 80, 60); s.add(sun);
  const rim = new THREE.DirectionalLight(0x27d3f5, 0.35); rim.position.set(60, 30, -60); s.add(rim);
  const cam = new THREE.PerspectiveCamera(fov, W / H, 1, 4000); cam.position.set(...camPos); cam.lookAt(...look);
  return { s, render: () => r.render(s, cam) };
}
function shadow(s, x, z, rad = 9) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(rad, 40), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32 }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.05, z); s.add(m);
}
function html(s) { slide.insertAdjacentHTML("beforeend", s); }
/** Glowing squares scattered like stage lights (fixed positions per slide, no randomness between renders). */
function squares(list) { html(list.map(([x, y, k]) => `<i class="sq ${k || ""}" style="left:${x}px;top:${y}px"></i>`).join("")); }
const place = (o, x, z, ry = 0, sc = 1) => { o.position.set(x, 0, z); o.rotation.y = ry * D; o.scale.setScalar(sc); return o; };

const HEADERS = {
  h_pose: ["Pose Mode", "Rotate and move every limb with the gizmo", "01"],
  h_live: ["Live Editor", "One screen that never reloads", "02"],
  h_cloaks: ["58 Cloaks", "Studio, Minecraft and your own capes", "03"],
  h_custom: ["Your Skins & Models", "Pack Builder website: skins, capes, 3D models", "04"],
  h_share: ["Share Presets", "Send an NPC as a code or a pack file", "05"],
  h_camera: ["Cameras & Photo", "Fly cams, cinematic shots, green screen", "06"],
  h_install: ["Install", "Three steps, no experiments needed", "07"]
};
const SLIDES = {
  async banner() {
    slide.classList.add("round");
    squares([[560, 60, ""], [190, 120, "s"], [640, 130, "c s"], [960, 70, "s"], [1060, 470, ""], [560, 480, "s"], [280, 520, "c s"], [800, 420, "c s"]]);
    html(`<div class="glow"></div><div class="copy" style="left:56px;top:160px;width:1100px;gap:14px">
      <span><span class="pill">BEDROCK EDITION</span></span>
      <h1 style="font-size:176px">NPC Studio</h1>
      <div class="tag" style="font-size:62px">Direct every scene.</div></div>
      <img class="tilt" src="${A.panelC}" alt="" style="width:340px;right:500px;top:46px;transform:perspective(1500px) rotateY(-24deg) rotateZ(-3deg);opacity:.92">
      <img class="tilt" src="${A.panelB}" alt="" style="width:360px;right:270px;top:30px;transform:perspective(1500px) rotateY(-24deg) rotateZ(-3deg)">
      <img class="tilt" src="${A.panelA}" alt="" style="width:380px;right:24px;top:50px;transform:perspective(1500px) rotateY(-24deg) rotateZ(-3deg)">`);
    const st = stage([0, 20, 160], [0, 20, 0]);
    const n = await npc(A.steve, { outline: true, pose: { rarm: [-20, 0, -12], larm: [-95, 25, 0], head: [-6, -18, 0], rleg: [-10, 0, 0], lleg: [8, 0, 0] } });
    st.s.add(place(n, 47, 40, -22, 1.3));
    const gz = gizmo(15, "move"); gz.position.set(10, 10, 6); n.add(gz);
    st.s.updateMatrixWorld(true); faceCamera(gz, [0, 20, 160]);
    st.render();
  },
  async studio() {
    squares([[1840, 120, "s"], [1060, 60, ""], [960, 990, "c s"], [130, 980, "s"]]);
    html(`<div class="copy" style="width:620px;top:190px">
      <div class="eyebrow">Real in-game panel · v4.26</div><h2>The studio panel</h2>
      <ul class="list">
        <li><span>Six tabs, one tap each<small>Display, Pose, Presets, World, Camera, Layers</small></span></li>
        <li><span>Sliders, steppers and slots<small>Your NPC changes while the panel stays open</small></span></li>
        <li><span>NPC heads and cameras on the right<small>Jump between them in one tap</small></span></li>
      </ul></div>
      <img class="frame" src="${A.shotDisplay}" alt="" style="width:1220px;right:60px;top:230px;transform:perspective(2200px) rotateY(-10deg)">`);
  },
  async camera() {
    squares([[1840, 120, "s"], [1060, 60, ""], [960, 990, "c s"], [130, 980, "s"]]);
    html(`<div class="copy" style="width:620px;top:190px">
      <div class="eyebrow">Cameras</div><h2>Cameras you can see</h2>
      <ul class="list">
        <li><span>Pyramid cameras show the real shot<small>Green = selected, place as many as you want</small></span></li>
        <li><span>Look through any camera<small>Thirds and Cross guides, FOV, shake, paths</small></span></li>
        <li><span>Fly Cam and 30 cinematic shots<small>Orbit, dolly zoom, drone fly-bys</small></span></li>
      </ul></div>
      <img class="frame" src="${A.shotCamWorld}" alt="" style="width:960px;right:200px;top:110px">
      <img class="frame" src="${A.shotCamPanel}" alt="" style="width:660px;right:50px;top:580px;transform:rotate(2deg)">`);
  },
  async header() {},
  async cover() {
    squares([[1840, 120, "s"], [1060, 80, ""], [980, 960, "c s"], [1780, 900, ""], [130, 980, "s"], [1500, 40, "c s"]]);
    html(`<div class="copy" style="top:170px">
      <img class="logo" src="${A.logo}" alt="">
      <div class="eyebrow">Minecraft Bedrock add-on</div>
      <h1>NPC Studio</h1>
      <p class="lede">Pose, dress and film NPCs like a studio. Cameras, capes, custom skins and 3D models, made for phones and PC.</p>
      <div class="chips"><span class="chip">Pose Mode gizmo</span><span class="chip">Live Editor</span><span class="chip">58 capes</span><span class="chip">Cinematic cameras</span></div>
    </div><div class="badge"><b>V3</b> · Bedrock 26.30+ · no experiments</div>`);
    const st = stage([0, 24, 150], [0, 17, 0]);
    st.s.add(place(await npc(A.soldier, { cape: A.capeMinecon, pose: { larm: [-60, 0, 20], rarm: [-30, 0, 0], head: [5, 20, 0] } }), 12, -16, 28));
    st.s.add(place(await npc(A.knight, { cape: A.capeCrimson, outline: true, pose: { rarm: [-110, 10, 0], head: [-8, -10, 0], larm: [10, 0, -8], rleg: [-14, 0, 0], lleg: [12, 0, 0] } }), 36, 4, -12, 1.05));
    st.s.add(place(await npc(A.assassin, { pose: { rarm: [-75, -30, 0], larm: [-75, 30, 0], body: [12, 0, 0], rleg: [-20, 0, 0], lleg: [16, 0, 0] } }), 60, -12, -34));
    shadow(st.s, 12, -16); shadow(st.s, 36, 4); shadow(st.s, 60, -12);
    st.render();
  },
  async pose() {
    squares([[1840, 120, "s"], [1060, 80, ""], [980, 960, "c s"], [1780, 900, ""], [130, 980, "s"], [1500, 40, "c s"]]);
    html(`<div class="copy">
      <div class="eyebrow">Pose Mode</div><h2>Pose every limb</h2>
      <ul class="list">
        <li><span>Red, green and blue gizmo<small>Rotate or move the part you look at</small></span></li>
        <li><span>Walk around while you pose<small>No more standing still to adjust</small></span></li>
        <li><span>45+ ready poses and 19 loops<small>Sit, fight, wave, dance, lie down</small></span></li>
        <li><span>Undo, redo, mirror<small>Every change can be taken back</small></span></li>
      </ul></div>`);
    const st = stage([0, 22, 120], [0, 17, 0]);
    const n = await npc(A.soldier, { pose: { rarm: [-130, 0, -10], larm: [-20, 0, 30], head: [-15, 0, 0], rleg: [-30, 0, 0], lleg: [20, 0, 0] } });
    st.s.add(place(n, 30, 0, -25)); shadow(st.s, 30, 0);
    const gz = gizmo(8, "rotate"); n.userData.parts.rarm.add(gz); // on the shoulder of the arm being posed
    st.s.updateMatrixWorld(true); faceCamera(gz, [0, 22, 120]);
    st.render();
  },
  async capes() {
    squares([[1840, 120, "s"], [1060, 80, ""], [980, 960, "c s"], [1780, 900, ""], [130, 980, "s"], [1500, 40, "c s"]]);
    const icons = A.capeIcons.map((s) => `<img src="${s}" alt="">`).join("");
    html(`<div class="copy" style="width:700px">
      <div class="eyebrow">Cloaks</div><h2>58 capes</h2>
      <p class="lede">8 studio capes, 43 Minecraft capes and 7 slots for your own. Pick them from pictures in the Cloak picker.</p>
    </div><div class="capes">${icons}</div>`);
